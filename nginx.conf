# Container içi nginx — Vite build çıktısını (SPA) sunar.
# Host nginx'i TLS + /api proxy'sini üstlenir; bu sadece statik sunumdur.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite'ın hash'li build asset'leri — agresif cache güvenli
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback (react-router client-side routing)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
